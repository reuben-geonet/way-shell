name: Nix

on:
  pull_request:
  push:
    branches: 
      - main

jobs:
  nix-check:
    name: nix-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            abort-on-warn = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Retain native Cargo dependencies
        run: |
          time nix build .#cargo-deps-native --out-link result-cargo-deps
          nix path-info --closure-size ./result-cargo-deps

      - name: Check flake
        run: nix flake check --option allow-import-from-derivation false --print-build-logs

      - name: Check dependency inputs and native reuse
        run: python3 nix/check-dependency-inputs.py --build

  installation-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.installation-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Generate installation matrix
        id: installation-matrix
        run: |
          matrix="$(nix eval --json .#lib.githubActions.matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  install-packages:
    name: ${{ matrix.name }}
    needs: installation-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.installation-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            abort-on-warn = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.name }}-
            nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Retain Cargo dependencies
        run: |
          package_test='${{ matrix.name }}'
          case "$package_test" in
            test-install-nixos) deps=cargo-deps-native ;;
            test-install-fedora-*) deps="cargo-deps-${package_test#test-install-}" ;;
            *) exit 0 ;;
          esac
          time nix build ".#$deps" --out-link result-cargo-deps --print-build-logs
          nix path-info --closure-size ./result-cargo-deps

      - name: Test package installation
        run: nix build --print-build-logs '.#${{ matrix.attr }}'

      - name: Check Fedora artifact reuse
        run: |
          package_test='${{ matrix.name }}'
          case "$package_test" in
            test-install-fedora-*)
              python3 nix/check-dependency-inputs.py --fedora "${package_test#test-install-fedora-}"
              ;;
          esac
