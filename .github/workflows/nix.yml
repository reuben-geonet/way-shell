name: Nix

on:
  pull_request:
  push:
    branches: 
      - main

jobs:
  nix-check:
    name: nix-checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            abort-on-warn = true

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Check integration tests
        run: nix build .#check-integration --print-build-logs

  build-packages:
    name: build-packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            abort-on-warn = true

      - name: Build RPMs
        run: nix run .#rpm
